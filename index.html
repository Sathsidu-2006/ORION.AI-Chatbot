<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>ORION AI</title>
</head>
<body>
    <div class="main">
        <div class="left-div">
            <img src="assets/ORION AI Futuristic Neon Logo.png" class="logo" alt="">

        </div>
        <div class="right-div">
            <div class="heading-container">
                <h1 class="heading">Where should we begin ? </h1>
                <p class="h-p">I'm ORION, your AI companion. Ask me anything, explore ideas, or let's create something extraordinary together.</p>
            </div>
            <div class="chat-Container">
                <div class="chat-box">
                    <div class="message user-message">HI</div>
                    <div class="message bot-message">Hi</div>
                </div>
                <div class="input-area">
                    <input type="text" placeholder="type your message" id="user-input" class="user-input">
                    <button onclick="sendButtonAction()" class="send-btn">Send</button>
                </div>                
            </div>
        </div>
    </div>

    
</body>
</html>
